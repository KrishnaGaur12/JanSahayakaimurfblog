<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans:wght@600&amp;display=swap');
      
      text {
        font-family: 'IBM Plex Mono', monospace;
      }
      .title {
        font-family: 'IBM Plex Sans', sans-serif;
        font-weight: 600;
      }
      .box-title {
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 1.5px;
      }
      .box-sub {
        font-size: 12px;
      }
    </style>
    
    <marker id="arrow-marigold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#E98A15" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="700" fill="#12172B" />

  <!-- Main Title -->
  <text x="700" y="80" class="title" font-size="32" fill="#FAF7F1" text-anchor="middle">How JanSahayak AI Works</text>

  <!-- Return loop arrow (Murf TTS -> Caller) -->
  <path d="M 1180 240 L 1180 160 Q 1180 140 1160 140 L 210 140 Q 190 140 190 160 L 190 232" 
        fill="none" stroke="#E98A15" stroke-width="3" marker-end="url(#arrow-marigold)" />

  <!-- Teal branching lines (supporting systems) -->
  <line x1="190" y1="380" x2="1180" y2="380" stroke="#0F6E63" stroke-width="2" />
  
  <line x1="900" y1="330" x2="900" y2="380" stroke="#0F6E63" stroke-width="2" />
  <line x1="190" y1="380" x2="190" y2="440" stroke="#0F6E63" stroke-width="2" />
  <line x1="410" y1="380" x2="410" y2="440" stroke="#0F6E63" stroke-width="2" />
  <line x1="640" y1="380" x2="640" y2="440" stroke="#0F6E63" stroke-width="2" />
  <line x1="900" y1="380" x2="900" y2="440" stroke="#0F6E63" stroke-width="2" />
  <line x1="1180" y1="380" x2="1180" y2="440" stroke="#0F6E63" stroke-width="2" />

  <!-- Teal dots at connections -->
  <circle cx="190" cy="380" r="4" fill="#0F6E63"/>
  <circle cx="410" cy="380" r="4" fill="#0F6E63"/>
  <circle cx="640" cy="380" r="4" fill="#0F6E63"/>
  <circle cx="900" cy="380" r="4" fill="#0F6E63"/>
  <circle cx="1180" cy="380" r="4" fill="#0F6E63"/>

  <circle cx="900" cy="330" r="4" fill="#0F6E63"/>
  <circle cx="190" cy="440" r="4" fill="#0F6E63"/>
  <circle cx="410" cy="440" r="4" fill="#0F6E63"/>
  <circle cx="640" cy="440" r="4" fill="#0F6E63"/>
  <circle cx="900" cy="440" r="4" fill="#0F6E63"/>
  <circle cx="1180" cy="440" r="4" fill="#0F6E63"/>

  <!-- Main flow horizontal arrows -->
  <line x1="270" y1="285" x2="312" y2="285" stroke="#E98A15" stroke-width="3" marker-end="url(#arrow-marigold)" />
  <line x1="500" y1="285" x2="542" y2="285" stroke="#E98A15" stroke-width="3" marker-end="url(#arrow-marigold)" />
  <line x1="730" y1="285" x2="772" y2="285" stroke="#E98A15" stroke-width="3" marker-end="url(#arrow-marigold)" />
  <line x1="1020" y1="285" x2="1062" y2="285" stroke="#E98A15" stroke-width="3" marker-end="url(#arrow-marigold)" />

  <!-- =============================== -->
  <!-- MAIN FLOW BOXES                 -->
  <!-- =============================== -->

  <!-- Caller -->
  <rect x="110" y="240" width="160" height="90" rx="8" fill="#1C2138" stroke="#565C74" stroke-width="1"/>
  <g transform="translate(176, 255)">
    <rect x="0" y="8" width="3" height="12" fill="#E98A15" rx="1"/>
    <rect x="6" y="2" width="3" height="18" fill="#E98A15" rx="1"/>
    <rect x="12" y="5" width="3" height="15" fill="#E98A15" rx="1"/>
    <rect x="18" y="0" width="3" height="20" fill="#E98A15" rx="1"/>
    <rect x="24" y="6" width="3" height="14" fill="#E98A15" rx="1"/>
  </g>
  <text x="190" y="295" class="box-title" fill="#FAF7F1" text-anchor="middle">CALLER</text>
  <text x="190" y="315" class="box-sub" fill="#9CA3AF" text-anchor="middle">(Phone/Web)</text>

  <!-- LiveKit Room -->
  <rect x="320" y="240" width="180" height="90" rx="8" fill="#1C2138" stroke="#565C74" stroke-width="1"/>
  <text x="410" y="280" class="box-title" fill="#FAF7F1" text-anchor="middle">LIVEKIT ROOM</text>
  <text x="410" y="305" class="box-sub" fill="#9CA3AF" text-anchor="middle">real-time transport</text>

  <!-- Deepgram STT -->
  <rect x="550" y="240" width="180" height="90" rx="8" fill="#1C2138" stroke="#565C74" stroke-width="1"/>
  <text x="640" y="280" class="box-title" fill="#FAF7F1" text-anchor="middle">DEEPGRAM STT</text>
  <text x="640" y="305" class="box-sub" fill="#9CA3AF" text-anchor="middle">Nova-3, multilingual</text>

  <!-- Gemini LLM -->
  <rect x="780" y="240" width="240" height="90" rx="8" fill="#1C2138" stroke="#565C74" stroke-width="1"/>
  <text x="900" y="280" class="box-title" fill="#FAF7F1" text-anchor="middle">GEMINI LLM</text>
  <text x="900" y="305" class="box-sub" fill="#9CA3AF" text-anchor="middle">3.5 Flash — reasoning engine</text>

  <!-- Murf Falcon TTS -->
  <rect x="1070" y="240" width="220" height="90" rx="8" fill="#1C2138" stroke="#565C74" stroke-width="1"/>
  <text x="1180" y="280" class="box-title" fill="#FAF7F1" text-anchor="middle">MURF FALCON TTS</text>
  <text x="1180" y="305" class="box-sub" fill="#9CA3AF" text-anchor="middle">hi-IN / en-IN voice</text>

  <!-- =============================== -->
  <!-- BRANCH BOXES                    -->
  <!-- =============================== -->

  <!-- SQLite Memory -->
  <rect x="100" y="440" width="180" height="90" rx="8" fill="#1C2138" stroke="#565C74" stroke-width="1"/>
  <text x="190" y="475" class="box-title" fill="#FAF7F1" text-anchor="middle">SQLITE MEMORY</text>
  <text x="190" y="498" class="box-sub" fill="#9CA3AF" text-anchor="middle">user consent,</text>
  <text x="190" y="516" class="box-sub" fill="#9CA3AF" text-anchor="middle">scheme history</text>

  <!-- Domain Tools -->
  <rect x="320" y="440" width="180" height="90" rx="8" fill="#1C2138" stroke="#565C74" stroke-width="1"/>
  <text x="410" y="475" class="box-title" fill="#FAF7F1" text-anchor="middle">DOMAIN TOOLS</text>
  <text x="410" y="498" class="box-sub" fill="#9CA3AF" text-anchor="middle">eligibility check,</text>
  <text x="410" y="516" class="box-sub" fill="#9CA3AF" text-anchor="middle">doc checklist</text>

  <!-- Escalation -->
  <rect x="550" y="440" width="180" height="90" rx="8" fill="#1C2138" stroke="#565C74" stroke-width="1"/>
  <text x="640" y="475" class="box-title" fill="#FAF7F1" text-anchor="middle">ESCALATION</text>
  <text x="640" y="498" class="box-sub" fill="#9CA3AF" text-anchor="middle">human handoff,</text>
  <text x="640" y="516" class="box-sub" fill="#9CA3AF" text-anchor="middle">urgency levels</text>

  <!-- Specialist Agent -->
  <rect x="780" y="440" width="240" height="90" rx="8" fill="#1C2138" stroke="#565C74" stroke-width="1"/>
  <text x="900" y="475" class="box-title" fill="#FAF7F1" text-anchor="middle">SPECIALIST AGENT</text>
  <text x="900" y="505" class="box-sub" fill="#9CA3AF" text-anchor="middle">govt schemes expert</text>

  <!-- Analytics DB -->
  <rect x="1070" y="440" width="220" height="90" rx="8" fill="#1C2138" stroke="#565C74" stroke-width="1"/>
  <text x="1180" y="475" class="box-title" fill="#FAF7F1" text-anchor="middle">ANALYTICS DB</text>
  <text x="1180" y="498" class="box-sub" fill="#9CA3AF" text-anchor="middle">call outcomes,</text>
  <text x="1180" y="516" class="box-sub" fill="#9CA3AF" text-anchor="middle">success tracking</text>

  <!-- Legend -->
  <text x="700" y="640" class="box-sub" fill="#9CA3AF" text-anchor="middle">Marigold = real-time voice pipeline · Teal = supporting systems</text>

</svg>
